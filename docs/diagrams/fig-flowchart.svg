<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1350" viewBox="0 0 1000 1350"><rect width="1000" height="1350" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12352a"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#12352a"/></marker></defs><text x="500" y="32.0" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#12352a">System flowchart: checking and locking an idea</text><rect x="315.0" y="58" width="170" height="52" rx="26" fill="#12352a"/><text x="400" y="84.0" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Start</text><line x1="400" y1="110" x2="400" y2="140" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="220.0" y="142.0" width="360" height="56" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="170.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Sign in, open Check an idea</text><line x1="400" y1="198" x2="400" y2="226" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><path d="M 210 228 L 610 228 L 590 290 L 190 290 Z" fill="#ffffff" stroke="#12352a" stroke-width="1.8"/><text x="400" y="248.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#12352a">Enter title, description,</text><text x="400" y="269.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#12352a">tags, domain, type</text><line x1="400" y1="290" x2="400" y2="318" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><path d="M 400 320.0 L 525.0 370 L 400 420.0 L 275.0 370 Z" fill="#fbf7ee" stroke="#12352a" stroke-width="1.8"/><text x="400" y="370.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#12352a">Input valid?</text><line x1="525" y1="370" x2="668" y2="370" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><text x="600" y="352.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#365547" stroke="#ffffff" stroke-width="5" paint-order="stroke">No</text><rect x="670.0" y="342.0" width="220" height="56" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="780.0" y="370.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Show field errors</text><path d="M 780 342 L 780 259 L 602 259" fill="none" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="400" y1="420" x2="400" y2="448" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><text x="422" y="434.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#365547" stroke="#ffffff" stroke-width="5" paint-order="stroke">Yes</text><rect x="190.0" y="450.0" width="420" height="68" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="473.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Fold synonyms, extract keywords,</text><text x="400.0" y="494.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">build fingerprint</text><line x1="400" y1="518" x2="400" y2="546" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="190.0" y="548.0" width="420" height="68" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="571.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Score against past projects and</text><text x="400.0" y="592.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">locked class ideas</text><line x1="400" y1="616" x2="400" y2="644" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="190.0" y="644.0" width="420" height="56" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="672.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Apply remembered corrections</text><line x1="400" y1="700" x2="400" y2="728" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="190.0" y="730.0" width="420" height="68" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="753.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Band the score, flag claims,</text><text x="400.0" y="774.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">save in one transaction</text><line x1="400" y1="798" x2="400" y2="826" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><rect x="220.0" y="826.0" width="360" height="56" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="854.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Evaluation screen, then result page</text><line x1="400" y1="882" x2="400" y2="916" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><path d="M 400 918.0 L 540.0 972 L 400 1026.0 L 260.0 972 Z" fill="#fbf7ee" stroke="#12352a" stroke-width="1.8"/><text x="400" y="961.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#12352a">Student locks</text><text x="400" y="982.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#12352a">for the group?</text><line x1="260" y1="972" x2="168" y2="972" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><text x="215" y="954.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#365547" stroke="#ffffff" stroke-width="5" paint-order="stroke">No</text><rect x="35.0" y="946" width="130" height="52" rx="26" fill="#12352a"/><text x="100" y="972.0" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#ffffff">End</text><line x1="400" y1="1026" x2="400" y2="1060" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><text x="422" y="1043.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#365547" stroke="#ffffff" stroke-width="5" paint-order="stroke">Yes</text><path d="M 400 1062.0 L 560.0 1120 L 400 1178.0 L 240.0 1120 Z" fill="#fbf7ee" stroke="#12352a" stroke-width="1.8"/><text x="400" y="1109.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#12352a">Already done, or group</text><text x="400" y="1130.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#12352a">already locked?</text><line x1="560" y1="1120" x2="668" y2="1120" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><text x="610" y="1102.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#365547" stroke="#ffffff" stroke-width="5" paint-order="stroke">Yes</text><rect x="670.0" y="1092.0" width="220" height="56" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="780.0" y="1120.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Refuse and explain</text><path d="M 780 1148 L 780 1330 L 100 1330 L 100 1000" fill="none" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><line x1="400" y1="1178" x2="400" y2="1210" stroke="#12352a" stroke-width="1.8" marker-end="url(#arr)"/><text x="422" y="1194.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#365547" stroke="#ffffff" stroke-width="5" paint-order="stroke">No</text><rect x="180.0" y="1216.0" width="440" height="68" rx="3" fill="#e8efe9" stroke="#12352a" stroke-width="1.8"/><text x="400.0" y="1239.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">Save proposal, record clashes</text><text x="400.0" y="1260.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#12352a">(triggers write the audit log)</text><path d="M 180 1250 L 100 1250" fill="none" stroke="#12352a" stroke-width="1.8"/></svg>